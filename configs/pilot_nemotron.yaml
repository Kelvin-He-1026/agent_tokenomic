# Phase 1 cell: Nemotron-3.5-Lightning-30B-A3B, BF16, TP=1. Hybrid Mamba-2 + MoE.
# Tool calls: XML <tool_call><function=><parameter=>, the same format as Qwen3.8
# -> qwen3_xml. Thinking: enable_thinking on/off only, no effort levels, and the
# template defaults it ON; reasoning split by vLLM's nemotron_v3 parser.
api_key: EMPTY
as_of_date: '2026-04-06'
base_url: http://127.0.0.1:8100/v1
chroma_collection: documents
chroma_dir: db/chroma
embedding_device: cpu
embedding_local_dir: bge-large-en-v1.5
embedding_model: BAAI/bge-large-en-v1.5
fixtures_dir: dataset/fixtures
framework: langgraph
limits:
  client_retries: 0
  max_llm_calls: 10
  parallel_tool_calls: false
  request_timeout_s: 120
  task_timeout_s: 600
model:
  gpu_memory_utilization: 0.9
  local_dir: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  max_model_len: 32768
  precision: bf16
  reasoning_effort: ''
  reasoning_parser: nemotron_v3
  repo: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  revision: main
  served_name: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  thinking_setting: 'off'
  tool_call_parser: qwen3_xml
  tp_size: 1
  reasoning_efforts: []
  template_date_kwarg: ''
models_dir: model
retrieval_top_k: 5
sampling:
  max_tokens: 1024
  seed: 1234
  stream: true
  temperature: 0.0
  top_p: 1.0
tool_mode: replay
