# Phase 1 cell: Llama-3.1-8B-Instruct, BF16, TP=1. The weak-model anchor for H5.
# Tool calls: JSON {"name", "parameters"} per the chat template -> llama3_json.
# No thinking mode: the template has no enable_thinking, so it runs "off" only.
# date_string: the template otherwise injects "Today Date: 26 Jul 2024",
# contradicting the frozen as_of_date in the system prompt.
api_key: EMPTY
as_of_date: '2026-04-06'
base_url: http://127.0.0.1:8100/v1
chroma_collection: documents
chroma_dir: db/chroma
embedding_device: cpu
embedding_local_dir: bge-large-en-v1.5
embedding_model: BAAI/bge-large-en-v1.5
fixtures_dir: dataset/fixtures
framework: langgraph
limits:
  client_retries: 0
  max_llm_calls: 10
  parallel_tool_calls: false
  request_timeout_s: 120
  task_timeout_s: 600
model:
  gpu_memory_utilization: 0.9
  local_dir: Llama-3.1-8B-Instruct
  max_model_len: 32768
  precision: bf16
  reasoning_effort: ''
  reasoning_parser: ''
  repo: meta-llama/Llama-3.1-8B-Instruct
  revision: main
  served_name: meta-llama/Llama-3.1-8B-Instruct
  thinking_setting: 'off'
  tool_call_parser: llama3_json
  tp_size: 1
  reasoning_efforts: []
  template_date_kwarg: date_string
models_dir: model
retrieval_top_k: 5
sampling:
  max_tokens: 1024
  seed: 1234
  stream: true
  temperature: 0.0
  top_p: 1.0
tool_mode: replay
