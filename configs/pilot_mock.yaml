# Smoke-test cell: mock upstream, no GPU. Verifies the harness, proxy, tool
# layer and telemetry joins before vLLM exists.
framework: langgraph
as_of_date: "2026-04-06"
base_url: "http://127.0.0.1:8100/v1"
api_key: "EMPTY"
tool_mode: replay
fixtures_dir: dataset/fixtures
model:
  repo: mock-model
  local_dir: mock-model
  served_name: mock-model
  precision: bf16
  tp_size: 1
sampling:
  temperature: 0.0
  max_tokens: 512
  seed: 1234
  stream: true
limits:
  max_llm_calls: 8
  request_timeout_s: 60
  task_timeout_s: 300
  client_retries: 0
  parallel_tool_calls: false
